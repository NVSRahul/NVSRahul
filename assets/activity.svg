<text x="360" y="60" class="label">Best streak</text>
<text x="360" y="84" class="value">3 days</text>

<circle cx="540" cy="70" r="40" stroke="#21262d" stroke-width="8" fill="none"/>
<circle cx="540" cy="70" r="40" class="ring"/>
</svg>
