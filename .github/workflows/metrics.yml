name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: NVSRahul

          repositories_batch: 50
          repositories_forks: no
          repositories_affiliations: owner

          template: classic
          base: header, repositories, activity
          config_timezone: Asia/Kolkata
          filename: metrics/github-metrics.svg
